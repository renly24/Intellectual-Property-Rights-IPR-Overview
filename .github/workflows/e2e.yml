name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  e2e:
    name: e2e (${{ matrix.course }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 教材ごとにビルドしてテストする（src/content/index.ts の COURSES）
        course: [copyright, cyber]
    env:
      # ビルドとテストの両方で同じ教材を選ぶ（テストは教材データから答えを読む）
      NEXT_PUBLIC_COURSE: ${{ matrix.course }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build static export
        run: npm run build

      - name: Run E2E tests (desktop + tablet)
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.course }}
          path: playwright-report/
          retention-days: 14
